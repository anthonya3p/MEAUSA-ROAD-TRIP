<body><main class="shell"><div class="app">
<header class="top"><div class="brand"><span class="brandmark">M</span><div><p>MEAUSA</p><h1>ROAD TRIP</h1></div></div><button class="head-action" id="topAdd" aria-label="Ajouter un road trip">＋</button></header>
<section id="home" class="view active"></section><section id="archives" class="view"></section><section id="trip" class="view"></section>
<nav class="bottom" id="bottomNav"><button data-view="home" class="active"><i>⌁</i>Voyages</button><button data-view="archives"><i>✓</i>Réalisés</button><button id="shareBtn"><i>↗</i>Partager</button><button id="settingsBtn"><i>•••</i>Options</button></nav>
</div></main>
<div class="sheet-wrap" id="sheetWrap"><div class="sheet" id="sheet"></div></div><div class="toast" id="toast"></div>
<script>
const KEY='meausa-road-trips-v2';let state={trips:[],activeTripId:null,view:'home'},menuStageId=null,map=null,routeLayer=null;
const DB_NAME='meausa-road-trip-files',DB_STORE='files';
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(DB_STORE))req.result.createObjectStore(DB_STORE,{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function putFile(record){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(record);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function getFile(id){const db=await openDB();return new Promise((resolve,reject)=>{const req=db.transaction(DB_STORE).objectStore(DB_STORE).get(id);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function removeFile(id){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.trips))state={...state,...x}}catch(e){}render()}
function persist(){localStorage.setItem(KEY,JSON.stringify({trips:state.trips,activeTripId:state.activeTripId}));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function fmt(d){if(!d)return 'Date à définir';return new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'short',year:'numeric'}).format(new Date(d+'T12:00:00'))}
function period(t){return `${fmt(t.startDate)} → ${fmt(t.endDate)}`}
function progress(t){const total=t.stages.length,done=t.stages.filter(s=>s.done).length;return{total,done,pct:total?Math.round(done/total*100):0}}
function coverStyle(t){return t.cover?`--trip-cover:url('${t.cover}')`:''}
function current(){return state.trips.find(t=>t.id===state.activeTripId)}
function showToast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(showToast.x);showToast.x=setTimeout(()=>t.classList.remove('show'),2200)}
function setView(v){state.view=v;document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===v));document.querySelectorAll('#bottomNav [data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===v));$('#topAdd').classList.toggle('hide',v==='trip');window.scrollTo({top:0,behavior:'smooth'});render()}
function render(){renderHome();renderArchives();renderTrip()}
function renderHome(){const active=state.trips.filter(t=>t.status==='active');let html='<div class="pad"><p class="kicker">MES VOYAGES</p><div class="title-row"><h2>Road trips</h2><button class="small-btn" onclick="openTripForm()">＋ Nouveau</button></div>';
if(!active.length){html+=`<section class="hero"><div class="hero-content"><span class="hero-chip">PRÊT POUR LA ROUTE</span><div class="hero-bottom"><p class="kicker">NOUVELLE AVENTURE</p><h2>Ton prochain road trip commence ici.</h2><p class="empty-copy">Crée ton voyage, ajoute librement tes étapes et conserve tous tes souvenirs dans un seul carnet.</p><button class="primary" onclick="openTripForm()">Créer mon premier road trip</button></div></div></section>`}
else{html+=active.map(t=>{const p=progress(t);return`<article class="trip-card" style="${coverStyle(t)}" onclick="openTrip('${t.id}')"><div class="trip-card-inner"><span class="tag">EN COURS</span><h3>${esc(t.name)}</h3><p>${period(t)}</p><div class="progress"><i style="width:${p.pct}%"></i></div><div class="trip-foot"><span>${p.done}/${p.total} étapes terminées</span><b>${p.pct}%</b></div></div></article>`}).join('');html+=`<section class="section-label"><h3>Prochaine aventure</h3><span>À tout moment</span></section><button class="primary" onclick="openTripForm()">＋ Ajouter un road trip</button>`}html+='</div>';$('#home').innerHTML=html}
function renderArchives(){const items=state.trips.filter(t=>t.status==='archived');let html='<div class="pad"><p class="kicker">SOUVENIRS</p><div class="title-row"><h2>Road trips réalisés</h2></div>';html+=items.length?items.map(t=>{const p=progress(t);return`<article class="archive-card" onclick="openTrip('${t.id}')"><span class="archive-thumb" style="${t.cover?`--cover:url('${t.cover}')`:''}"></span><div><strong>${esc(t.name)}</strong><small>${period(t)} · ${p.total} étapes</small></div><button>›</button></article>`}).join(''):`<div class="empty-list"><b>✓</b><p>Les voyages terminés et archivés apparaîtront ici, toujours consultables.</p></div>`;html+='</div>';$('#archives').innerHTML=html}
function renderTrip(){const t=current();if(!t){$('#trip').innerHTML='';return}const p=progress(t),arch=t.status==='archived';let html=`<section class="detail-hero" style="${t.cover?`--cover:url('${t.cover}')`:''}"><button class="detail-back" onclick="setView('${arch?'archives':'home'}')">‹</button><button class="detail-more" onclick="openTripMenu()">•••</button><div class="detail-copy"><p class="kicker">${arch?'ROAD TRIP RÉALISÉ':'ROAD TRIP EN COURS'}</p><h2>${esc(t.name)}</h2><p>${period(t)} · ${p.done}/${p.total} étapes</p>${arch?'<span class="readonly">ARCHIVÉ · CONSULTATION</span>':''}</div></section><div class="pad">`;
if(!arch)html+=`<div class="detail-actions"><button class="add" onclick="openStageForm()">＋ Ajouter une étape</button><button class="edit" onclick="openTripForm('${t.id}')">Modifier le voyage</button></div>`;
html+=`<section class="map-card"><div class="map-head"><div><strong>Carte du parcours</strong><small>Visible automatiquement dans l’ordre des étapes</small></div><button onclick="buildMap(true)">Recalculer</button></div><div id="tripMap" class="map-loading"><div><b>⌖</b>${t.stages.length<2?'Ajoute au moins deux étapes avec une adresse.':'Chargement automatique du parcours…'}</div></div><div class="map-actions"><button onclick="map&&map.fitBounds(routeLayer?routeLayer.getBounds():map.getBounds(),{padding:[25,25]})">Recentrer la carte</button><a id="googleRoute" href="${googleMapsUrl(t)}" target="_blank" rel="noopener">Navigation Google Maps</a></div><div class="map-info" id="mapInfo"><span><b>—</b> km</span><span><b>—</b> de route</span></div></section>`;
html+=`<section class="section-label"><h3>Itinéraire</h3><span>${p.pct}% réalisé</span></section>`;
if(!t.stages.length)html+=`<div class="empty-list"><b>⌁</b><p>Aucune étape imposée. Ajoute la première destination de ton véritable parcours.</p></div>`;
else html+=`<div class="timeline">${t.stages.map((s,i)=>{const docs=s.documents||[];return `<article class="stage ${s.done?'done':''}"><span class="stage-dot">${s.done?'✓':i+1}</span><div class="stage-main" onclick="${arch?`openDocuments('${s.id}',true)`:`openStageForm('${s.id}')`}"><span class="stage-date">${fmt(s.date)}</span><strong>${esc(s.name)}</strong>${s.location||s.notes?`<p>${esc(s.location)}${s.location&&s.notes?' · ':''}${esc(s.notes)}</p>`:''}${docs.length?`<div class="stage-doc-list" onclick="event.stopPropagation()">${docs.map(d=>`<button class="stage-doc-file" onclick="openDocument('${d.id}')"><i>${d.type?.includes('pdf')?'PDF':'▤'}</i><span>${esc(d.name)}</span></button>`).join('')}</div>`:''}<button class="stage-doc-add" onclick="event.stopPropagation();openDocuments('${s.id}',${arch})">${docs.length?`▤ Gérer les documents (${docs.length})`:'＋ Ajouter documents / réservations'}</button>${!arch?`<div class="stage-order"><button onclick="event.stopPropagation();moveStage('${s.id}',-1)" ${i===0?'disabled':''}>↑ Monter</button><button onclick="event.stopPropagation();moveStage('${s.id}',1)" ${i===t.stages.length-1?'disabled':''}>↓ Descendre</button></div>`:''}</div>${arch?'':`<button class="stage-menu" onclick="openStageMenu('${s.id}')">•••</button>`}</article>`}).join('')}</div>`;
if(!arch&&t.stages.length)html+=`<button class="primary finish" onclick="archiveTrip()">Terminer et archiver ce road trip</button>`;html+='</div>';$('#trip').innerHTML=html;if(t.stages.length>=2)setTimeout(()=>buildMap(false),120)}
function openTrip(id){state.activeTripId=id;persist();setView('trip')}
function openSheet(html){$('#sheet').innerHTML=`<div class="handle"></div>${html}`;$('#sheetWrap').classList.add('open')}
function closeSheet(){ $('#sheetWrap').classList.remove('open') }
$('#sheetWrap').addEventListener('click',e=>{if(e.target===e.currentTarget)closeSheet()})
function openTripForm(id){const t=id?state.trips.find(x=>x.id===id):null;openSheet(`<h3>${t?'Modifier':'Nouveau'} road trip</h3><p>Tu pourras ajouter les étapes juste après.</p><form id="tripForm"><label class="field"><span>Nom du road trip</span><input name="name" required placeholder="Ex. Road trip Côte Ouest" value="${esc(t?.name||'')}"></label><div class="date-grid"><label class="field"><span>Date de départ</span><input type="date" name="startDate" value="${t?.startDate||''}"></label><label class="field"><span>Date de retour</span><input type="date" name="endDate" value="${t?.endDate||''}"></label></div><label class="photo-field"><input type="file" name="cover" accept="image/*"><strong>📷 Choisir une photo de couverture</strong><small>${t?.cover?'Une photo est déjà enregistrée':'Facultatif · une photo est incluse par défaut'}</small></label><div class="sheet-actions"><button type="button" class="cancel" onclick="closeSheet()">Annuler</button><button class="save">${t?'Enregistrer':'Créer le voyage'}</button></div></form>`);$('#tripForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),file=f.get('cover');let cover=t?.cover||'';if(file&&file.size)cover=await resizeImage(file);if(t){Object.assign(t,{name:f.get('name').trim(),startDate:f.get('startDate'),endDate:f.get('endDate'),cover})}else{const n={id:uid(),name:f.get('name').trim(),startDate:f.get('startDate'),endDate:f.get('endDate'),cover,status:'active',createdAt:new Date().toISOString(),stages:[]};state.trips.unshift(n);state.activeTripId=n.id}persist();closeSheet();render();if(!t)setView('trip');showToast(t?'Voyage modifié':'Road trip créé')}}
function openStageForm(id){const t=current(),s=id?t.stages.find(x=>x.id===id):null;openSheet(`<h3>${s?'Modifier':'Ajouter'} une étape</h3><p>L’adresse précise permet de calculer le tracé sur la carte.</p><form id="stageForm"><label class="field"><span>Nom de l’étape</span><input name="name" required placeholder="Ex. Las Vegas" value="${esc(s?.name||'')}"></label><label class="field"><span>Date prévue</span><input type="date" name="date" value="${s?.date||''}"></label><label class="field"><span>Adresse ou lieu pour la carte</span><input name="location" placeholder="Ex. 3600 Las Vegas Blvd, Las Vegas, NV" value="${esc(s?.location||'')}"></label><label class="field"><span>Notes</span><textarea name="notes" placeholder="Réservation, programme, idée de tournage…">${esc(s?.notes||'')}</textarea></label><div class="sheet-actions"><button type="button" class="cancel" onclick="closeSheet()">Annuler</button><button class="save">Enregistrer</button></div></form>`);$('#stageForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),data={name:f.get('name').trim(),date:f.get('date'),location:f.get('location').trim(),notes:f.get('notes').trim()};if(s){if(s.location!==data.location||s.name!==data.name){s.lat=null;s.lng=null;s.mapLabel=null}s.documents=s.documents||[];Object.assign(s,data)}else t.stages.push({id:uid(),...data,done:false,completedAt:null,lat:null,lng:null,documents:[]});persist();closeSheet();render();showToast(s?'Étape modifiée':'Étape ajoutée')}}
function sortStages(t){t.stages.sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'))}
function openStageMenu(id){menuStageId=id;const s=current().stages.find(x=>x.id===id);openSheet(`<h3>${esc(s.name)}</h3><p>Gère cette étape et ses réservations.</p><div class="action-list"><button onclick="closeSheet();openDocuments('${id}')">▤ Documents et réservations ${s.documents?.length?`(${s.documents.length})`:''}</button><button onclick="toggleStage('${id}')">${s.done?'↩ Marquer comme non réalisée':'✓ Marquer comme réalisée'}</button><button onclick="closeSheet();openStageForm('${id}')">✎ Modifier l’étape</button><button onclick="closeSheet();locateSingleStage('${id}')">⌖ Positionner sur la carte</button><button class="danger" onclick="deleteStage('${id}')">⌫ Supprimer l’étape</button></div>`)}
function moveStage(id,dir){const t=current(),i=t.stages.findIndex(s=>s.id===id),j=i+dir;if(i<0||j<0||j>=t.stages.length)return;[t.stages[i],t.stages[j]]=[t.stages[j],t.stages[i]];persist();renderTrip();showToast('Ordre du parcours modifié')}
function openDocuments(stageId,readonly=false){const s=current().stages.find(x=>x.id===stageId);s.documents=s.documents||[];openSheet(`<h3>Réservations</h3><p>${esc(s.name)} · PDF, billets, confirmations et photos.</p>${readonly?'':`<label class="doc-upload"><input type="file" multiple accept="application/pdf,image/*,.doc,.docx,.xls,.xlsx" onchange="addDocuments('${stageId}',this.files)">＋ Ajouter des documents</label>`}<div class="docs-list">${s.documents.length?s.documents.map(d=>`<div class="doc-row"><span class="doc-icon">${d.type?.includes('pdf')?'PDF':'▤'}</span><div><strong>${esc(d.name)}</strong><small>${formatBytes(d.size)} · ${fmtDateTime(d.createdAt)}</small></div><button onclick="openDocument('${d.id}')">↗</button>${readonly?'':`<button class="danger" onclick="deleteDocument('${stageId}','${d.id}')">×</button>`}</div>`).join(''):`<div class="empty-list"><b>▤</b><p>Aucun document ajouté à cette étape.</p></div>`}</div><div class="sheet-actions"><button class="cancel" onclick="closeSheet()">Fermer</button>${readonly?'':`<button class="save" onclick="document.querySelector('.doc-upload input').click()">Ajouter</button>`}</div>`)}
async function addDocuments(stageId,fileList){const files=[...fileList],s=current().stages.find(x=>x.id===stageId);s.documents=s.documents||[];if(!files.length)return;for(const file of files){if(file.size>25*1024*1024){alert(`${file.name} dépasse 25 Mo et n’a pas été ajouté.`);continue}const id=uid();await putFile({id,blob:file,name:file.name,type:file.type,size:file.size,createdAt:new Date().toISOString()});s.documents.push({id,name:file.name,type:file.type,size:file.size,createdAt:new Date().toISOString()})}persist();render();openDocuments(stageId);showToast('Document ajouté')}
async function openDocument(id){const win=window.open('about:blank','_blank');try{const f=await getFile(id);if(!f)throw 0;const url=URL.createObjectURL(f.blob);if(win)win.location=url;else location.href=url;setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(e){if(win)win.close();alert('Ce document est introuvable sur cet appareil.')}}
async function deleteDocument(stageId,id){if(!confirm('Supprimer ce document de cette étape ?'))return;await removeFile(id);const s=current().stages.find(x=>x.id===stageId);s.documents=(s.documents||[]).filter(d=>d.id!==id);persist();render();openDocuments(stageId);showToast('Document supprimé')}
function formatBytes(n){if(n<1024)return `${n} o`;if(n<1048576)return `${Math.round(n/1024)} Ko`;return `${(n/1048576).toFixed(1)} Mo`}
function fmtDateTime(v){return v?new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'short',year:'numeric'}).format(new Date(v)):''}
function googleMapsUrl(t){const pts=t.stages.map(s=>s.location||s.name).filter(Boolean);if(pts.length<2)return'https://www.google.com/maps';const origin=encodeURIComponent(pts[0]),destination=encodeURIComponent(pts.at(-1)),waypoints=pts.slice(1,-1).map(encodeURIComponent).join('%7C');return`https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}${waypoints?`&waypoints=${waypoints}`:''}&travelmode=driving`}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function geocodeStage(s){if(Number.isFinite(s.lat)&&Number.isFinite(s.lng))return true;const q=(s.location||s.name).trim();if(!q)return false;const url=`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=us&q=${encodeURIComponent(q)}`;const res=await fetch(url,{headers:{'Accept':'application/json'}});if(!res.ok)throw new Error('geocode');const data=await res.json();if(!data.length)return false;s.lat=Number(data[0].lat);s.lng=Number(data[0].lon);s.mapLabel=data[0].display_name;return true}
async function buildMap(userTriggered=false){const t=current(),box=$('#tripMap'),info=$('#mapInfo');if(!t||!box)return;if(userTriggered){t.stages.forEach(s=>{s.lat=null;s.lng=null;s.mapLabel=null});persist()}if(typeof L==='undefined'){box.className='map-loading';box.innerHTML='<div><b>!</b>La carte nécessite une connexion internet.</div>';return}const candidates=t.stages.filter(s=>(s.location||s.name));if(candidates.length<2){box.className='map-loading';box.innerHTML='<div><b>⌖</b>Ajoute au moins deux étapes avec une adresse.</div>';return}box.className='map-loading';box.innerHTML='<div><b>⌖</b>Positionnement des étapes en cours…</div>';let found=[],missing=[];for(const s of candidates){try{const ok=await geocodeStage(s);ok?found.push(s):missing.push(s)}catch(e){missing.push(s)}if(!Number.isFinite(s.lat)&&candidates.indexOf(s)<candidates.length-1)await sleep(1100)}persist();if(found.length<2){box.innerHTML='<div><b>!</b>Impossible de positionner suffisamment d’étapes. Ajoute une adresse plus précise.</div>';return}box.className='trip-map';box.innerHTML='';if(map){map.remove();map=null}map=L.map(box,{zoomControl:false});L.control.zoom({position:'bottomright'}).addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);const bounds=[];found.forEach((s,i)=>{const icon=L.divIcon({className:'',html:`<div style="width:28px;height:28px;border-radius:50%;background:${s.done?'#347d62':'#e6543d'};color:#fff;border:3px solid white;display:grid;place-items:center;font:800 10px sans-serif;box-shadow:0 3px 8px #0004">${i+1}</div>`,iconSize:[28,28],iconAnchor:[14,14]});L.marker([s.lat,s.lng],{icon}).addTo(map).bindPopup(`<b>${esc(s.name)}</b><br>${esc(s.location||'')}`);bounds.push([s.lat,s.lng])});map.fitBounds(bounds,{padding:[28,28]});try{const coords=found.map(s=>`${s.lng},${s.lat}`).join(';'),res=await fetch(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson&steps=false`),data=await res.json();if(data.code!=='Ok'||!data.routes?.length)throw 0;const r=data.routes[0];routeLayer=L.geoJSON(r.geometry,{style:{color:'#e6543d',weight:5,opacity:.86}}).addTo(map);map.fitBounds(routeLayer.getBounds(),{padding:[25,25]});const km=Math.round(r.distance/1000),hours=Math.floor(r.duration/3600),mins=Math.round((r.duration%3600)/60);info.innerHTML=`<span><b>${km.toLocaleString('fr-FR')}</b> km</span><span><b>${hours?hours+' h ':''}${mins} min</b> de route</span>`}catch(e){routeLayer=L.polyline(bounds,{color:'#e6543d',weight:4,dashArray:'8 8'}).addTo(map);info.innerHTML='<span>Tracé routier temporairement indisponible</span>'}if(missing.length)showToast(`${missing.length} étape${missing.length>1?'s':''} non positionnée${missing.length>1?'s':''}`);setTimeout(()=>map.invalidateSize(),100)}
async function locateSingleStage(id){const s=current().stages.find(x=>x.id===id);s.lat=null;s.lng=null;try{const ok=await geocodeStage(s);persist();renderTrip();ok?(showToast('Étape positionnée'),setTimeout(()=>buildMap(),80)):alert('Adresse introuvable. Renseigne une adresse plus précise.')}catch(e){alert('Impossible de joindre le service cartographique. Vérifie ta connexion.')}}
function toggleStage(id){const s=current().stages.find(x=>x.id===id);s.done=!s.done;s.completedAt=s.done?new Date().toISOString():null;persist();closeSheet();render();showToast(s.done?'Étape terminée':'Étape réouverte')}
async function deleteStage(id){if(!confirm('Supprimer définitivement cette étape et ses documents ?'))return;const t=current(),s=t.stages.find(x=>x.id===id);for(const d of(s?.documents||[]))await removeFile(d.id);t.stages=t.stages.filter(x=>x.id!==id);persist();closeSheet();render();showToast('Étape supprimée')}
function openTripMenu(){const t=current();openSheet(`<h3>${esc(t.name)}</h3><p>Options du road trip.</p><div class="action-list">${t.status==='active'?`<button onclick="closeSheet();openTripForm('${t.id}')">✎ Modifier le voyage</button><button onclick="shareTrip()">↗ Partager le résumé</button><button class="danger" onclick="deleteTrip()">⌫ Supprimer le road trip</button>`:`<button onclick="shareTrip()">↗ Partager le souvenir</button><button onclick="restoreTrip()">↩ Repasser en voyage actif</button><button class="danger" onclick="deleteTrip()">⌫ Supprimer définitivement</button>`}</div>`)}
function archiveTrip(){const t=current(),p=progress(t);if(p.total&&!confirm(`Archiver ce voyage avec ${p.done}/${p.total} étapes réalisées ?`))return;t.status='archived';t.archivedAt=new Date().toISOString();persist();render();setView('archives');showToast('Road trip archivé')}
function restoreTrip(){const t=current();t.status='active';delete t.archivedAt;persist();closeSheet();render();setView('trip');showToast('Road trip réactivé')}
async function deleteTrip(){if(!confirm('Supprimer définitivement ce road trip, ses étapes et ses documents ?'))return;const t=current();for(const s of t.stages)for(const d of(s.documents||[]))await removeFile(d.id);state.trips=state.trips.filter(x=>x.id!==t.id);state.activeTripId=null;persist();closeSheet();render();setView('home');showToast('Road trip supprimé')}
async function shareTrip(){const t=current()||state.trips.find(x=>x.status==='active'),p=t?progress(t):null;if(!t){showToast('Crée d’abord un road trip');return}const text=`MEAUSA ROAD TRIP — ${t.name}\n${period(t)}\n${p.done}/${p.total} étapes réalisées (${p.pct} %)`;try{if(navigator.share)await navigator.share({title:'MEAUSA ROAD TRIP',text});else{await navigator.clipboard.writeText(text);showToast('Résumé copié')}}catch(e){}closeSheet()}
function resizeImage(file){return new Promise((resolve,reject)=>{const r=new FileReader;r.onload=()=>{const img=new Image;img.onload=()=>{const c=document.createElement('canvas'),max=900,scale=Math.min(1,max/img.width);c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.78))};img.onerror=reject;img.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
$('#topAdd').onclick=()=>openTripForm();$('#bottomNav').onclick=e=>{const b=e.target.closest('[data-view]');if(b)setView(b.dataset.view)};$('#shareBtn').onclick=shareTrip;$('#settingsBtn').onclick=()=>openSheet(`<h3>MEAUSA ROAD TRIP</h3><p>Les données sont conservées sur cet appareil.</p><div class="action-list"><button onclick="exportData()">⇩ Exporter une sauvegarde</button><button onclick="document.querySelector('#importFile').click()">⇧ Importer une sauvegarde</button><input id="importFile" class="hide" type="file" accept="application/json" onchange="importData(this.files[0])"><button class="danger" onclick="clearData()">⌫ Effacer toutes les données</button></div>`);
function exportData(){const blob=new Blob([JSON.stringify({trips:state.trips},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='meausa-road-trips.json';a.click();URL.revokeObjectURL(a.href);closeSheet()}
function importData(file){if(!file)return;const r=new FileReader;r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.trips))throw 0;state.trips=d.trips;state.activeTripId=null;persist();closeSheet();render();setView('home');showToast('Sauvegarde importée')}catch(e){alert('Fichier de sauvegarde invalide')}};r.readAsText(file)}
function clearData(){if(!confirm('Effacer tous les road trips enregistrés sur cet appareil ?'))return;state.trips=[];state.activeTripId=null;persist();closeSheet();render();setView('home');showToast('Données effacées')}
load();
</script></body></html>
