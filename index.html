<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f0e6">
  <title>MEAUSA ROAD TRIP</title>
  <meta name="description" content="Suivez notre road trip aux États-Unis, étape par étape.">
  <style>
    :root{--ink:#26231f;--paper:#f5f0e6;--card:#fffdf8;--red:#d64b35;--muted:#8b8277}*{box-sizing:border-box}html{background:#e6ded2}body{margin:0;color:var(--ink);background:#e6ded2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}.shell{min-height:100dvh;display:flex;justify-content:center;background:linear-gradient(135deg,#e9e0d3,#cfc0aa)}.app{position:relative;width:100%;max-width:430px;min-height:100dvh;overflow:hidden;background:var(--paper);padding-bottom:96px;box-shadow:0 20px 80px #55493833}.top{height:100px;display:grid;place-items:center;padding:18px 20px 12px;position:relative;z-index:5;background:#f5f0e6e8;backdrop-filter:blur(16px)}.brand{display:flex;align-items:center;gap:10px}.mark{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;color:#fff;background:var(--red);font:700 22px Georgia;box-shadow:0 8px 20px #d64b3540}.eyebrow{margin:0 0 1px;font-size:8px;letter-spacing:.35em;color:#8c8174;font-weight:700}.top h1{margin:0;font-family:"Arial Narrow",Arial,sans-serif;font-size:21px;line-height:1;letter-spacing:.08em;font-weight:900}.avatar{position:absolute;right:18px;top:31px;width:35px;height:35px;border:1px solid #cfc3b4;border-radius:50%;background:#fffaf1;font-size:9px;font-weight:800}.switch{margin:0 15px 14px;padding:11px 14px;border:1px solid #e0d6c8;border-radius:15px;display:flex;align-items:center;justify-content:space-between;background:#fffaf2;box-shadow:0 8px 26px #6758400a}.switch span{display:block;color:#9b9186;font-size:8px;letter-spacing:.14em;text-transform:uppercase}.switch strong{font-size:11px;letter-spacing:.08em}.screen{padding:0 14px 28px;animation:in .28s ease-out}@keyframes in{from{opacity:0;transform:translateY(5px)}}.hero{height:390px;position:relative;overflow:hidden;border-radius:26px;background:url("assets/utah-road-hero.png") center 64%/cover;border:4px solid #fffaf2;box-shadow:0 18px 45px #5c493332}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#4f361518 0,transparent 33%,#24180b22 56%,#1c1209c7 100%)}.live{position:absolute;top:14px;left:14px;right:14px;display:flex;align-items:center;padding:9px 11px;border-radius:99px;font-size:7px;letter-spacing:.11em;color:#3b352e;background:#fffaf0d9;backdrop-filter:blur(14px);border:1px solid #ffffffcc}.dot{width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:7px;box-shadow:0 0 0 4px #d64b3522}.delay{margin-left:auto}.hero-copy{position:absolute;left:20px;right:20px;bottom:19px;color:#fffaf2;text-shadow:0 2px 18px #23150955}.hero-copy>p{margin:0;font-size:8px;letter-spacing:.2em;color:#ff806a;font-weight:800}.hero h2{margin:7px 0 18px;font:900 45px/.9 "Arial Narrow",Arial,sans-serif;letter-spacing:-.04em}.hero h2 b{color:#ff694f;font-weight:400}.stats{display:flex;border-top:1px solid #fff7e65c;padding-top:12px}.stats div{flex:1;border-right:1px solid #fff7e642;padding-left:12px}.stats div:first-child{padding-left:0}.stats div:last-child{border:0}.stats strong{font-size:18px}.stats span{display:block;margin-top:2px;font-size:8px;color:#e3d9c9;text-transform:uppercase}.toggle{display:grid;grid-template-columns:1fr 1fr;padding:4px;margin:18px 0 14px;border-radius:15px;background:#e8dfd2}.toggle button{border:0;border-radius:11px;padding:11px;background:transparent;color:#92877a;font-size:10px;font-weight:700}.toggle .active{color:#29241f;background:#fffdf8;box-shadow:0 5px 14px #8d775722}.card{border-radius:23px;background:var(--card);border:1px solid #e7ddcf;overflow:hidden;box-shadow:0 14px 40px #66513610}.heading{display:flex;align-items:flex-end;justify-content:space-between;padding:19px 18px 12px}.heading p,.page-title p{margin:0 0 5px;font-size:8px;letter-spacing:.17em;color:var(--red);font-weight:800}.heading h3{margin:0;font-size:18px}.heading>span{font-size:10px;color:#998f83}.map{position:relative;height:170px;margin:0 10px;overflow:hidden;border-radius:17px;background:linear-gradient(145deg,#e9dfd0,#d8c9b5)}.map:before{content:"USA";position:absolute;right:14px;top:8px;font:900 42px/1 "Arial Narrow";color:#6f5f4910}.map svg{position:absolute;inset:7px 8px 22px;width:calc(100% - 16px);height:132px}.shadow,.line{fill:none;stroke-linecap:round}.shadow{stroke:#fff;stroke-width:9;opacity:.55}.line{stroke:#574b3d;stroke-width:3.5;stroke-dasharray:3 8}.done,.next{stroke:#fffaf2;stroke-width:2.5}.done{fill:#5d5142}.next{fill:var(--red)}.cities{position:absolute;bottom:8px;left:8px;right:8px;display:flex;justify-content:space-between;font-size:7px;color:#695d50;font-weight:600}.timeline{padding:7px 16px 13px}.stop{display:flex;align-items:center;gap:10px;min-height:49px;border-bottom:1px solid #eee6db}.stop:last-child{border:0}.check{width:25px;height:25px;display:grid;place-items:center;border:1px solid var(--red);border-radius:50%;color:var(--red);font-size:8px}.check.ok{background:var(--red);color:#fff}.stop strong,.stop small{display:block}.stop strong{font-size:12px}.stop small{font-size:8px;color:#a0968a;margin-top:2px}.stop em{margin-left:auto;font-size:7px;color:#9d9387;font-style:normal;text-transform:uppercase}.publish{display:flex;align-items:center;gap:11px;padding:10px;margin:14px 0;border:1px solid #e6dbcc;border-radius:20px;background:#fffdf8}.photo{width:78px;height:78px;flex:none;border-radius:14px;background:url("assets/utah-road-hero.png") center 53%/cover}.publish span,.publish strong,.publish small{display:block}.publish span{color:var(--red);font-size:7px;letter-spacing:.12em;font-weight:800}.publish strong{font-size:12px;margin:5px 0}.publish small{color:#9a9084;font-size:8px}.share{margin-left:auto;border:0;background:var(--red);color:#fff;width:32px;height:32px;border-radius:50%}.bottom{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:82px;display:flex;background:#fffdf8ed;backdrop-filter:blur(18px);border-top:1px solid #dfd3c4;padding:8px 6px max(8px,env(safe-area-inset-bottom))}.bottom button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;color:#aaa093;font-size:8px}.bottom i{height:26px;font-size:22px;font-style:normal}.bottom .active{color:#443c34;font-weight:700}.bottom .active i{color:var(--red)}.page-title{padding:10px 4px 22px}.page-title h2{margin:0;font:900 42px/1 "Arial Narrow",Arial,sans-serif;letter-spacing:-.035em}.page-title span{display:block;color:#968b7e;font-size:11px;margin-top:8px}.feature{padding:20px;margin-bottom:14px;border-radius:23px;color:#fffaf2;background:linear-gradient(145deg,#b9754f,#744936);box-shadow:0 16px 35px #7a4b3430}.feature label{display:block;color:#ffd4c9;font-size:8px;letter-spacing:.14em;font-weight:800}.feature strong{display:block;margin:9px 0 4px;font-size:17px}.feature p{margin:0;color:#ead7ca;font-size:10px}.feature button{width:100%;margin-top:16px;border:0;border-radius:12px;padding:12px;background:#fffaf2;color:#6b4030;font-weight:800;font-size:10px}.row{display:flex;align-items:center;padding:14px;margin-bottom:9px;min-height:71px;border:1px solid #e7dccd;border-radius:17px;background:#fffdf8}.row small,.row strong{display:block}.row small{color:#9c9185;font-size:8px;margin-bottom:4px}.row strong{font-size:12px}.row>span{margin-left:auto;padding:6px 8px;border-radius:8px;background:#f1e9de;color:#7d7266;font-size:7px;text-transform:uppercase}.hidden{display:none}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</head>
<body>
<main class="shell"><div class="app">
  <header class="top"><div class="brand"><span class="mark">M</span><div><p class="eyebrow">MEAUSA</p><h1>ROAD TRIP</h1></div></div><button class="avatar">AG</button></header>
  <section class="switch"><div><span>Voyage actif</span><strong>USA · AOÛT 2026</strong></div><b>⌄</b></section>
  <div id="content"></div>
  <nav class="bottom" id="nav">
    <button data-tab="route" class="active"><i>⌁</i><span>Parcours</span></button><button data-tab="bookings"><i>▣</i><span>Réservations</span></button><button data-tab="shooting"><i>●</i><span>Tournage</span></button><button data-tab="documents"><i>▤</i><span>Documents</span></button>
  </nav>
</div></main>
<script>
const route=`<div class="screen"><section class="hero"><div class="live"><span class="dot"></span>MISE À JOUR AUTOMATIQUE <span class="delay">+ 8 H</span></div><div class="hero-copy"><p>ÉTAPE PUBLIÉE</p><h2>DALLAS <b>→</b><br>EPHRAIM</h2><div class="stats"><div><strong>1 560</strong><span>km</span></div><div><strong>20 h</strong><span>de route</span></div><div><strong>3/4</strong><span>étapes</span></div></div></div></section><section class="toggle"><button>Privé</button><button class="active">Vue publique</button></section><section class="card"><div class="heading"><div><p>NOTRE PARCOURS</p><h3>De la Floride à l’Utah</h3></div><span>4 320 km</span></div><div class="map"><svg viewBox="0 0 340 132"><path class="shadow" d="M24 102 C70 75 92 97 126 73 S190 74 220 47 S282 48 316 24"/><path class="line" d="M24 102 C70 75 92 97 126 73 S190 74 220 47 S282 48 316 24"/><circle cx="24" cy="102" r="5" class="done"/><circle cx="126" cy="73" r="5" class="done"/><circle cx="220" cy="47" r="5" class="done"/><circle cx="316" cy="24" r="7" class="next"/></svg><div class="cities"><span>Miami</span><span>New Orleans</span><span>Dallas</span><span>Ephraim</span></div></div><div class="timeline">${[["Miami","15 août",1],["New Orleans","17 août",1],["Dallas","19 août",1],["Ephraim","21 août",0]].map(x=>`<div class="stop"><span class="check ${x[2]?'ok':''}">${x[2]?'✓':'4'}</span><div><strong>${x[0]}</strong><small>${x[1]}</small></div><em>${x[2]?'Publié':'À venir'}</em></div>`).join('')}</div></section><section class="publish"><div class="photo"></div><div><span>DERNIÈRE PUBLICATION</span><strong>Sur la route de Capitol Reef</strong><small>Publié automatiquement après notre départ</small></div><button class="share">↗</button></section></div>`;
const data={bookings:{k:'VOYAGE PRIVÉ',t:'Réservations',s:'Tout ce qu’il faut, au bon moment.',f:['PROCHAINE ACTION','Prise en charge du véhicule','Miami International Airport · 15 août, 10:30'],rows:[['15 août · 07:10','Vol Paris → Miami','Confirmé'],['17–19 août','Hôtel New Orleans','Confirmé'],['15–29 août','Location SUV','À vérifier'],['21–28 août','Logement Snow College','Confirmé']]},shooting:{k:'SNOW COLLEGE',t:'Plan de tournage',s:'8 jours de reportage, plan par plan.',f:['PROGRESSION','12 / 38 plans','32 % du reportage filmé'],rows:[['Plans extérieurs','Arrivée sur le campus','Terminé'],['Plan large · détails','Découverte de la chambre','Terminé'],['Ambiance · interview','Greenwood & premier match','À filmer'],['Accueil · plans de coupe','Rentrée des internationaux','À venir']]},documents:{k:'COFFRE PRIVÉ',t:'Documents',s:'Disponibles même sans connexion.',f:['DOCUMENTS','Ajouter un document','PDF, photo ou confirmation'],rows:[['Voucher · PDF','Location de voiture','Auto'],['2 fichiers sécurisés','Passeports & visas','Identité'],['Contrat · PDF','Assurance voyage','Assurance'],['Autorisations','Snow College','Reportage']]}};
function utility(d){return `<div class="screen"><header class="page-title"><p>${d.k}</p><h2>${d.t}</h2><span>${d.s}</span></header><section class="feature"><label>${d.f[0]}</label><strong>${d.f[1]}</strong><p>${d.f[2]}</p><button>${d.t==='Réservations'?'Ouvrir le voucher':'Ouvrir'}</button></section>${d.rows.map(r=>`<article class="row"><div><small>${r[0]}</small><strong>${r[1]}</strong></div><span>${r[2]}</span></article>`).join('')}</div>`}
function show(tab){document.querySelector('#content').innerHTML=tab==='route'?route:utility(data[tab]);document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));scrollTo({top:0,behavior:'smooth'})}document.querySelector('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)show(b.dataset.tab)});show('route');
</script>
</body></html>
